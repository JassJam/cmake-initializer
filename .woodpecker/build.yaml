when:
  - event: pull_request
    branch: [main, dev]

steps:
##################
# BUILD PIPELINE #
##################

  # Linux / Clang - x86_64
  - name: build-linux-x86_64-clang-debug
    image: dockcross/linux-x64-clang
    commands:
      - cmake -S . -B build/linux-x86_64-clang-debug --preset linux-x86_64-clang-debug
      - cmake --build build/linux-x86_64-clang-debug
    when:
    - event: [pull_request]
      branch: [main, dev]

  # Emscripten
  - name: build-emscripten-wasm32-debug
    image: dockcross/web-wasm
    commands:
      - cmake -S . -B build/emscripten-wasm32-debug --preset emscripten-wasm32-debug
      - cmake --build build/emscripten-wasm32-debug --config Debug
    when:
      - event: tag

#################
# TEST PIPELINE #
#################

  # Linux / Clang - x86_64
  - name: test-linux-x86_64-clang-debug
    image: dockcross/linux-x64-clang
    commands:
      - ctest --test-dir build/linux-x86_64-clang-debug --build-config Debug --output-on-failure
    when:
      - event: [pull_request]
        branch: [main, dev]
