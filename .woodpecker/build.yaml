when:
  - event: pull_request
    branch: [main, dev]

steps:
  ###################
  # BUILD PIPELINE  #
  ###################

  - name: build-linux-x86_64-debug
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: x86_64-linux-gnu
    commands:
      - crossbuild cmake -S . -B build/linux-x86_64-debug --preset linux-x86_64-debug
      - crossbuild cmake --build build/linux-x86_64-debug --parallel

  - name: build-linux-arm64-debug
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: aarch64-linux-gnu
    commands:
      - crossbuild cmake -S . -B build/linux-arm64-debug --preset linux-arm64-debug
      - crossbuild cmake --build build/linux-arm64-debug --parallel

  - name: build-linux-x86-debug
    image: dockcross/linux-x86
    commands:
      - cmake -S . -B build/linux-x86-debug --preset linux-x86-debug
      - cmake --build build/linux-x86-debug --parallel

  - name: build-windows-x86_64-debug
    image: mstorsjo/llvm-mingw
    environment:
      CC: x86_64-w64-mingw32-clang
      CXX: x86_64-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-x86_64-debug --preset windows-x86_64-debug
      - cmake --build build/windows-x86_64-debug --parallel

  - name: build-windows-x86-debug
    image: mstorsjo/llvm-mingw
    environment:
      CC: i686-w64-mingw32-clang
      CXX: i686-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-x86-debug --preset windows-x86-debug
      - cmake --build build/windows-x86-debug --parallel

  - name: build-windows-arm64-debug
    image: mstorsjo/llvm-mingw
    environment:
      CC: aarch64-w64-mingw32-clang
      CXX: aarch64-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-arm64-debug --preset windows-arm64-debug
      - cmake --build build/windows-arm64-debug --parallel

  - name: build-macos-x86_64-debug
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: x86_64-apple-darwin
    commands:
      - crossbuild cmake -S . -B build/macos-x86_64-debug --preset macos-x86_64-debug
      - crossbuild cmake --build build/macos-x86_64-debug --parallel

  - name: build-macos-arm64-debug
    image: debian:trixie
    environment:
      MACOS_SDK_VERSION: "14.0"
    commands:
      - bash ./.woodpecker/scripts/setup-osxcross.sh
      - . ./.osxcross-env
      - cmake -S . -B build/macos-arm64-debug --preset macos-arm64-debug
      - cmake --build build/macos-arm64-debug --parallel

  - name: build-emscripten-wasm32-debug
    image: dockcross/web-wasm
    commands:
      - cmake -S . -B build/emscripten-wasm32-debug --preset emscripten-wasm32-debug
      - cmake --build build/emscripten-wasm32-debug --config Debug --parallel

  ###################
  # TEST PIPELINE   #
  ###################

  - name: test-linux-x86_64-debug
    image: multiarch/crossbuild
    depends_on: [build-linux-x86_64-debug]
    environment:
      CROSS_TRIPLE: x86_64-linux-gnu
    commands:
      - crossbuild ctest --test-dir build/linux-x86_64-debug --output-on-failure
