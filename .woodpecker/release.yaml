when:
  - event: tag

steps:
  ###################
  # BUILD PIPELINE  #
  ###################

  - name: build-linux-x86_64-release
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: x86_64-linux-gnu
    commands:
      - crossbuild cmake -S . -B build/linux-x86_64-release --preset linux-x86_64-release
      - crossbuild cmake --build build/linux-x86_64-release --parallel
      - crossbuild cmake --install build/linux-x86_64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-linux-x86_64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-linux-x86_64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-linux-x86_64

  - name: build-linux-arm64-release
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: aarch64-linux-gnu
    commands:
      - crossbuild cmake -S . -B build/linux-arm64-release --preset linux-arm64-release
      - crossbuild cmake --build build/linux-arm64-release --parallel
      - crossbuild cmake --install build/linux-arm64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-linux-arm64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-linux-arm64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-linux-arm64

  - name: build-linux-x86-release
    image: dockcross/linux-x86
    commands:
      - cmake -S . -B build/linux-x86-release --preset linux-x86-release
      - cmake --build build/linux-x86-release --parallel
      - cmake --install build/linux-x86-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-linux-x86
      - tar -czf dist/usagi-$CI_COMMIT_TAG-linux-x86.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-linux-x86

  - name: build-windows-x86_64-release
    image: mstorsjo/llvm-mingw
    environment:
      CC: x86_64-w64-mingw32-clang
      CXX: x86_64-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-x86_64-release --preset windows-x86_64-release
      - cmake --build build/windows-x86_64-release --parallel
      - cmake --install build/windows-x86_64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-windows-x86_64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-windows-x86_64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-windows-x86_64

  - name: build-windows-x86-release
    image: mstorsjo/llvm-mingw
    environment:
      CC: i686-w64-mingw32-clang
      CXX: i686-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-x86-release --preset windows-x86-release
      - cmake --build build/windows-x86-release --parallel
      - cmake --install build/windows-x86-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-windows-x86
      - tar -czf dist/usagi-$CI_COMMIT_TAG-windows-x86.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-windows-x86

  - name: build-windows-arm64-release
    image: mstorsjo/llvm-mingw
    environment:
      CC: aarch64-w64-mingw32-clang
      CXX: aarch64-w64-mingw32-clang++
    commands:
      - cmake -S . -B build/windows-arm64-release --preset windows-arm64-release
      - cmake --build build/windows-arm64-release --parallel
      - cmake --install build/windows-arm64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-windows-arm64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-windows-arm64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-windows-arm64

  - name: build-macos-x86_64-release
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: x86_64-apple-darwin
    commands:
      - crossbuild cmake -S . -B build/macos-x86_64-release --preset macos-x86_64-release
      - crossbuild cmake --build build/macos-x86_64-release --parallel
      - crossbuild cmake --install build/macos-x86_64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-macos-x86_64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-macos-x86_64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-macos-x86_64

  - name: build-macos-arm64-release
    image: debian:trixie
    environment:
      MACOS_SDK_VERSION: "14.0"
    commands:
      - bash ./.woodpecker/scripts/setup-osxcross.sh
      - . ./.osxcross-env
      - cmake -S . -B build/macos-arm64-release --preset macos-arm64-release
      - cmake --build build/macos-arm64-release --parallel
      - cmake --install build/macos-arm64-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-macos-arm64
      - tar -czf dist/usagi-$CI_COMMIT_TAG-macos-arm64.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-macos-arm64

  - name: build-emscripten-wasm32-release
    image: dockcross/web-wasm
    commands:
      - cmake -S . -B build/emscripten-wasm32-release --preset emscripten-wasm32-release
      - cmake --build build/emscripten-wasm32-release --config Release --parallel
      - cmake --install build/emscripten-wasm32-release --prefix dist/stage/usagi-$CI_COMMIT_TAG-wasm32
      - tar -czf dist/usagi-$CI_COMMIT_TAG-wasm32.tar.gz -C dist/stage usagi-$CI_COMMIT_TAG-wasm32

  ###################
  # TEST PIPELINE   #
  ###################

  - name: test-linux-x86_64-debug
    image: multiarch/crossbuild
    environment:
      CROSS_TRIPLE: x86_64-linux-gnu
    commands:
      - crossbuild cmake -S . -B build/linux-x86_64-debug --preset linux-x86_64-debug
      - crossbuild cmake --build build/linux-x86_64-debug --parallel
      - crossbuild ctest --test-dir build/linux-x86_64-debug --output-on-failure

  ###################
  # PUBLISH         #
  ###################

  - name: publish
    image: woodpeckerci/plugin-release
    depends_on:
      - build-linux-x86_64-release
      - build-linux-arm64-release
      - build-linux-x86-release
      - build-windows-x86_64-release
      - build-windows-x86-release
      - build-windows-arm64-release
      - build-macos-x86_64-release
      - build-macos-arm64-release
      - build-emscripten-wasm32-release
      - test-linux-x86_64-debug
    settings:
      base-url: https://codeberg.org
      api-key:
        from_secret: FORGEJO_PUBLISH_TOKEN
      files: dist/*.tar.gz
      checksum: sha256
      title: ${CI_COMMIT_TAG}
